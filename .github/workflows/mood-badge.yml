name: Update Mood Badge

on:
  schedule:
    - cron: "0 17 * * *"   # 22:00 lokal (UTC+5)
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "mood-badge"
  cancel-in-progress: true

jobs:
  update-mood:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Get today's contributions
        run: |
          username="Abdumajidov2005"
          today=$(date +"%Y-%m-%d")  # lokal vaqt
          
          query=$(jq -n \
            --arg login "$username" \
            --arg from "${today}T00:00:00Z" \
            --arg to "${today}T23:59:59Z" \
            '{query:"{ user(login: \($login)) { contributionsCollection(from: \($from), to: \($to)) { contributionCalendar { totalContributions } } } }"}')

          response=$(curl -s \
            -H "Authorization: bearer ${{ secrets.PAT_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$query" \
            https://api.github.com/graphql)

          count=$(echo $response | jq '.data.user.contributionsCollection.contributionCalendar.totalContributions // 0')
          echo "CONTRIB_COUNT=$count" >> $GITHUB_ENV
          echo "Today's contributions: $count"

      - name: Generate Mood Badge
        run: |
          if [ "$CONTRIB_COUNT" -eq 0 ]; then
            mood="No Coding"
            status="Needs Coffee"
            color="#808080"
          elif [ "$CONTRIB_COUNT" -le 3 ]; then
            mood="Coding"
            status="Working"
            color="#00D1FF"
          elif [ "$CONTRIB_COUNT" -le 7 ]; then
            mood="Brainstorming"
            status="Active"
            color="#FFD700"
          else
            mood="🔥 Coding Today"
            status="On Fire"
            color="#FF0000"
          fi

          # URL encode for badge
          mood_enc=$(echo "$mood" | sed 's/ /%20/g')
          status_enc=$(echo "$status" | sed 's/ /%20/g')
          badge="<p align='center'><img src='https://img.shields.io/badge/${mood_enc}(${CONTRIB_COUNT}%20${status_enc})-${color#'#'}?style=for-the-badge' /></p>"

          # Update README
          awk -v badge="$badge" '
            /<!-- MOOD_START -->/ {print; print badge; skip=1; next}
            /<!-- MOOD_END -->/ {skip=0}
            !skip
          ' README.md > temp.md && mv temp.md README.md

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "Update global mood badge"
            git push
          else
            echo "No changes in README, skipping commit."
