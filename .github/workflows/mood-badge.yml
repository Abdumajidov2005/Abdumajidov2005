name: Update Mood Badge by Contributions

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-mood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Get daily contributions
        run: |
          username="OtkirbekDEV"
          date=$(date -u +"%Y-%m-%d")
          count=$(curl -s "https://api.github.com/users/$username/events" \
            | jq '[.[] | select(.type=="PushEvent" and (.created_at | startswith("'"$date"'")))] | length')
          echo "contrib_count=$count" >> $GITHUB_ENV

      - name: Set mood badges
        run: |
          if [ $contrib_count -eq 0 ]; then mood="<p align='center'><img src='https://img.shields.io/badge/No-Coding-808080?style=for-the-badge' /><img src='https://img.shields.io/badge/Coffee-Needed-6F4E37?style=for-the-badge' /></p>"; fi
          if [ $contrib_count -ge 1 ] && [ $contrib_count -le 3 ]; then mood="<p align='center'><img src='https://img.shields.io/badge/Coding-FE7C00?style=for-the-badge' /><img src='https://img.shields.io/badge/Coffee-Needed-6F4E37?style=for-the-badge' /></p>"; fi
          if [ $contrib_count -ge 4 ] && [ $contrib_count -le 7 ]; then mood="<p align='center'><img src='https://img.shields.io/badge/Brainstorming-00D1FF?style=for-the-badge' /><img src='https://img.shields.io/badge/Coffee-Ready-FFD700?style=for-the-badge' /></p>"; fi
          if [ $contrib_count -ge 8 ]; then mood="<p align='center'><img src='https://img.shields.io/badge/🔥-Coding-Today-FF0000?style=for-the-badge' /><img src='https://img.shields.io/badge/☕-Coffee-FFA500?style=for-the-badge' /></p>"; fi
          sed -i "s|<!-- MOOD_START -->.*<!-- MOOD_END -->|<!-- MOOD_START -->$mood<!-- MOOD_END -->|" README.md

      - name: Commit & Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "Update mood badges by daily contributions"
          git push
