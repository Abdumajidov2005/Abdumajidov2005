name: Update Global Mood Badge

on:
  push:
    branches:
      - main
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-mood:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Get today's global contributions
        run: |
          username="Abdumajidov2005"
          today=$(date -u +"%Y-%m-%d")

          query="{\"query\":\"{ user(login: \\\"$username\\\") { contributionsCollection(from: \\\"${today}T00:00:00Z\\\", to: \\\"${today}T23:59:59Z\\\") { contributionCalendar { totalContributions } } } }\"}"

          response=$(curl -s \
            -H "Authorization: bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$query" \
            https://api.github.com/graphql)

          count=$(echo $response | jq '.data.user.contributionsCollection.contributionCalendar.totalContributions')

          echo "CONTRIB_COUNT=$count" >> $GITHUB_ENV

      - name: Generate Mood Badge
        run: |
          if [ "$CONTRIB_COUNT" -eq 0 ]; then
            mood="No Coding"
            color="808080"
          elif [ "$CONTRIB_COUNT" -le 3 ]; then
            mood="Coding"
            color="00D1FF"
          elif [ "$CONTRIB_COUNT" -le 7 ]; then
            mood="Brainstorming"
            color="FFD700"
          else
            mood="🔥 Coding Today"
            color="FF0000"
          fi

          badge="<p align='center'><img src='https://img.shields.io/badge/${mood// /%20}-$color?style=for-the-badge' /></p>"

          awk -v badge="$badge" '
            /<!-- MOOD_START -->/ {print; print badge; skip=1; next}
            /<!-- MOOD_END -->/ {skip=0}
            !skip
          ' README.md > temp.md && mv temp.md README.md

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "Update global mood badge"
          git push
