name: Update Global Mood Badge

on:
push:
    branches:
      - main
  schedule:
    - cron: "0 21 * * *"   # Har kuni 21:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-mood:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Get today's global contributions
        run: |
          username="Abdumajidov2005"
          today=$(date -u +"%Y-%m-%d")

          query=$(cat <<EOF
          {
            user(login: "$username") {
              contributionsCollection(from: "${today}T00:00:00Z", to: "${today}T23:59:59Z") {
                contributionCalendar {
                  totalContributions
                }
              }
            }
          }
          EOF
          )

          response=$(curl -s \
            -H "Authorization: bearer ${{ secrets.GITHUB_TOKEN }}" \
            -X POST \
            -d "{\"query\": \"$query\"}" \
            https://api.github.com/graphql)

          count=$(echo $response | jq '.data.user.contributionsCollection.contributionCalendar.totalContributions')

          echo "Today's global contributions: $count"
          echo "CONTRIB_COUNT=$count" >> $GITHUB_ENV

      - name: Generate Mood Badge
        run: |
          if [ "$CONTRIB_COUNT" -eq 0 ]; then
            mood="<p align='center'><img src='https://img.shields.io/badge/No%20Coding-808080?style=for-the-badge' /><img src='https://img.shields.io/badge/Coffee%20Needed-6F4E37?style=for-the-badge' /></p>"
          elif [ "$CONTRIB_COUNT" -le 3 ]; then
            mood="<p align='center'><img src='https://img.shields.io/badge/Coding-00D1FF?style=for-the-badge' /><img src='https://img.shields.io/badge/Coffee%20Needed-6F4E37?style=for-the-badge' /></p>"
          elif [ "$CONTRIB_COUNT" -le 7 ]; then
            mood="<p align='center'><img src='https://img.shields.io/badge/Brainstorming-FFD700?style=for-the-badge' /><img src='https://img.shields.io/badge/Coffee%20Ready-6F4E37?style=for-the-badge' /></p>"
          else
            mood="<p align='center'><img src='https://img.shields.io/badge/🔥%20Coding%20Today-FF0000?style=for-the-badge' /><img src='https://img.shields.io/badge/☕%20Coffee%20Mode-FFA500?style=for-the-badge' /></p>"
          fi

          sed -i "/<!-- MOOD_START -->/,/<!-- MOOD_END -->/c\\
<!-- MOOD_START -->\\
$mood\\
<!-- MOOD_END -->" README.md

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "Update global mood badge"
          git push
