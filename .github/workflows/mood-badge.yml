name: 🚀 Premium Mood System (Debug)

on:
  schedule:
    - cron: "*/30 * * * *"   # har 30 minut
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Get Contributions Data (Debug)
        env:
          TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          username="Abdumajidov2005"

          # Timezone: Toshkent
          today=$(TZ=Asia/Tashkent date +"%Y-%m-%d")
          week_ago=$(TZ=Asia/Tashkent date -d "7 days ago" +"%Y-%m-%d")

          echo "Today: $today"
          echo "Week ago: $week_ago"

          query=$(jq -n \
            --arg login "$username" \
            --arg from "${week_ago}T00:00:00Z" \
            --arg to "${today}T23:59:59Z" \
            '{
              query: "query($login:String!, $from:DateTime!, $to:DateTime!) {
                user(login:$login) {
                  contributionsCollection(from:$from, to:$to) {
                    contributionCalendar {
                      totalContributions
                    }
                  }
                }
              }",
              variables: {login:$login, from:$from, to:$to}
            }')

          echo "GraphQL Query:"
          echo "$query"

          response=$(curl -s -H "Authorization: bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "$query" https://api.github.com/graphql)

          echo "GraphQL Response:"
          echo "$response"

          total=$(echo "$response" | jq '.data.user.contributionsCollection.contributionCalendar.totalContributions // 0')
          echo "TOTAL CONTRIBUTIONS: $total"

          echo "WEEK_COUNT=$total" >> $GITHUB_ENV

      - name: Generate Animated SVG Badge
        run: |
          count=$WEEK_COUNT

          if [ "$count" -eq 0 ]; then
            mood="Sleeping 😴"
          elif [ "$count" -le 10 ]; then
            mood="Coding Mode 💻"
          elif [ "$count" -le 25 ]; then
            mood="Beast Mode 🔥"
          else
            mood="ON FIRE 🚀"
          fi

          cat <<EOF > mood.svg
          <svg width="500" height="120" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="grad">
                <stop offset="0%" stop-color="#ff0000">
                  <animate attributeName="stop-color"
                    values="#ff0000;#ff7300;#fffb00;#48ff00;#00ffd5;#002bff;#7a00ff;#ff00c8;#ff0000"
                    dur="8s" repeatCount="indefinite"/>
                </stop>
                <stop offset="100%" stop-color="#00ffff">
                  <animate attributeName="stop-color"
                    values="#00ffff;#ff00ff;#ffff00;#00ffff"
                    dur="6s" repeatCount="indefinite"/>
                </stop>
              </linearGradient>
            </defs>

            <rect width="500" height="120" rx="20" fill="url(#grad)"/>
            
            <text x="50%" y="45%" dominant-baseline="middle" text-anchor="middle"
              font-size="28" fill="white" font-family="Verdana">
              $mood
            </text>

            <text x="50%" y="75%" dominant-baseline="middle" text-anchor="middle"
              font-size="20" fill="white" font-family="Verdana">
              Weekly Contributions: $count
            </text>
          </svg>
          EOF

      - name: Update README
        run: |
          sed -i '/<!-- MOOD_START -->/,/<!-- MOOD_END -->/{
          /<!-- MOOD_START -->/!{/<!-- MOOD_END -->/!d}
          }' README.md

          sed -i "/<!-- MOOD_START -->/a <p align='center'><img src='mood.svg' width='500'/></p>" README.md

      - name: Commit Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "🚀 Update Premium Mood System" || echo "No changes"
          git push
