name: Update Pull Shark Progress

on:
  schedule:
    - cron: "0 * * * *"  # har soatda UTC
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y jq curl

      - name: Debug info
        run: |
          echo "Running on branch: $GITHUB_REF"
          echo "Bash version: $BASH_VERSION"

      - name: Count merged PRs and generate SVG
        env:
          TOKEN: ${{ secrets.PAT_TOKEN }}
          GITHUB_USER: Abdumajidov2005    # o'zingizning GitHub username
          REPO: ${{ github.repository }}
          BRANCH: main                   # asosiy branch nomi
        run: |
          set -e

          # Count merged PRs
          RESPONSE=$(curl -s -H "Authorization: token $TOKEN" \
            "https://api.github.com/search/issues?q=is:pr+is:merged+author:$GITHUB_USER")
          echo "API response preview:"
          echo "$RESPONSE" | head -n 10

          COUNT=$(echo "$RESPONSE" | jq '.total_count')
          echo "Merged PRs count: $COUNT"

          # Fail if count is null
          if [ "$COUNT" == "null" ]; then
            echo "Error: Could not fetch PR count. Check token permissions or username."
            exit 1
          fi

          # Levels and colors
          LEVELS=("Bronze" "Silver" "Gold" "Platinum")
          TARGETS=(2 16 128 1024)
          COLORS=("#cd7f32" "#c0c0c0" "#ffd700" "#e5e4e2")

          # Start SVG
          SVG="<svg width=\"400\" height=\"30\" xmlns=\"http://www.w3.org/2000/svg\">"
          X=0
          BAR_WIDTH=100

          for i in ${!LEVELS[@]}
          do
            LEVEL=${LEVELS[$i]}
            TARGET=${TARGETS[$i]}
            COLOR=${COLORS[$i]}

            if [ $COUNT -ge $TARGET ]; then
              PERCENT=100
              CUR=$TARGET
            else
              PERCENT=$((COUNT * 100 / TARGET))
              CUR=$COUNT
            fi

            FILL_WIDTH=$((BAR_WIDTH * PERCENT / 100))

            # Background
            SVG="$SVG<rect x=\"$X\" y=\"0\" width=\"$BAR_WIDTH\" height=\"20\" fill=\"#e0e0e0\" rx=\"5\" ry=\"5\" />"

            # Filled bar
            SVG="$SVG<rect x=\"$X\" y=\"0\" width=\"$FILL_WIDTH\" height=\"20\" fill=\"$COLOR\" rx=\"5\" ry=\"5\" />"

            # Label
            SVG="$SVG<text x=\"$((X + BAR_WIDTH / 2))\" y=\"15\" font-size=\"10\" text-anchor=\"middle\" fill=\"#000\">$LEVEL $CUR/$TARGET</text>"

            X=$((X + BAR_WIDTH))
          done

          SVG="$SVG</svg>"

          # Save SVG
          echo "$SVG" > pr-progress-bar.svg
          echo "SVG generated successfully."

      - name: Commit and push SVG
        env:
          TOKEN: ${{ secrets.PAT_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: main
        run: |
          set -e
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add pr-progress-bar.svg
          git diff --cached --quiet || git commit -m "Update Pull Shark gradient progress"

          # Debug git remote
          git remote set-url origin https://$TOKEN@github.com/$REPO.git
          git remote -v

          # Push
          git push origin $BRANCH
          echo "SVG committed and pushed successfully."
