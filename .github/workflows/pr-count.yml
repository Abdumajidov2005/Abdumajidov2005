name: Update PR Count

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Count merged PRs
        run: |
          COUNT=$(curl -s "https://api.github.com/search/issues?q=is:pr+is:merged+author:${{ github.repository_owner }}" | jq '.total_count')
          sed -i "s/Merged PRs:.*/Merged PRs: $COUNT/" README.md

      - name: Commit changes
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add README.md
          git commit -m "Update PR count" || exit 0
          git push
