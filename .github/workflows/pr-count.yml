name: Update Pull Shark Progress

on:
  pull_request:
    types: [closed]
  workflow_dispatch:

jobs:
  update:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Count merged PRs (GraphQL)
        env:
          TOKEN: ${{ secrets.PAT_TOKEN }}
          GITHUB_USER: Abdumajidov2005
        run: |
          set -e

          RESPONSE=$(curl -s \
            -H "Authorization: bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -X POST https://api.github.com/graphql \
            -d "{\"query\":\"query { user(login: \\\"$GITHUB_USER\\\") { pullRequests(states: MERGED) { totalCount } } }\"}"
          )

          echo "API response:"
          echo "$RESPONSE"

          COUNT=$(echo "$RESPONSE" | jq '.data.user.pullRequests.totalCount')

          if [ "$COUNT" == "null" ] || [ -z "$COUNT" ]; then
            echo "Error: Could not fetch PR count"
            exit 1
          fi

          echo "Merged PRs: $COUNT"
          echo "COUNT=$COUNT" >> $GITHUB_ENV

      - name: Generate SVG
        env:
          COUNT: ${{ env.COUNT }}
        run: |
          set -e
          COUNT=$COUNT

          LEVELS=("Bronze" "Silver" "Gold" "Platinum")
          TARGETS=(2 16 128 1024)
          COLORS=("#cd7f32" "#c0c0c0" "#ffd700" "#e5e4e2")

          SVG="<svg width=\"420\" height=\"40\" xmlns=\"http://www.w3.org/2000/svg\">"
          X=0
          BAR_WIDTH=100

          for i in ${!LEVELS[@]}
          do
            LEVEL=${LEVELS[$i]}
            TARGET=${TARGETS[$i]}
            COLOR=${COLORS[$i]}

            if [ $COUNT -ge $TARGET ]; then
              PERCENT=100
              CUR=$TARGET
            else
              PERCENT=$((COUNT * 100 / TARGET))
              CUR=$COUNT
            fi

            FILL_WIDTH=$((BAR_WIDTH * PERCENT / 100))

            SVG="$SVG<rect x=\"$X\" y=\"5\" width=\"$BAR_WIDTH\" height=\"20\" fill=\"#e0e0e0\" rx=\"6\" />"
            SVG="$SVG<rect x=\"$X\" y=\"5\" width=\"$FILL_WIDTH\" height=\"20\" fill=\"$COLOR\" rx=\"6\" />"
            SVG="$SVG<text x=\"$((X + BAR_WIDTH / 2))\" y=\"35\" font-size=\"10\" text-anchor=\"middle\">$LEVEL $CUR/$TARGET</text>"

            X=$((X + BAR_WIDTH + 5))
          done

          SVG="$SVG</svg>"

          echo "$SVG" > pr-progress-bar.svg
          echo "SVG created"

      - name: Commit & Push
        env:
          TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          set -e

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add pr-progress-bar.svg

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "auto: update Pull Shark progress"

          git remote set-url origin https://$TOKEN@github.com/${{ github.repository }}.git
          git push
