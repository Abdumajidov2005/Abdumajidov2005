name: Update Pull Shark Progress

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Count merged PRs
        run: |
          COUNT=$(curl -s "https://api.github.com/search/issues?q=is:pr+is:merged+author:Abdumajidov2005" | jq '.total_count')

          # Level thresholds
          if [ $COUNT -ge 1024 ]; then
            LEVEL="Platinum"
            TARGET=1024
          elif [ $COUNT -ge 128 ]; then
            LEVEL="Gold"
            TARGET=128
          elif [ $COUNT -ge 16 ]; then
            LEVEL="Silver"
            TARGET=16
          else
            LEVEL="Bronze"
            TARGET=2
          fi

          # Calculate progress %
          PERCENT=$((COUNT * 100 / TARGET))
          if [ $PERCENT -gt 100 ]; then PERCENT=100; fi

          # Update JSON
          echo "{ \"level\": \"$LEVEL\", \"progress\": \"$PERCENT% ($COUNT / $TARGET)\" }" > pr-progress.json

      - name: Commit changes
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add pr-progress.json
          git commit -m "Update Pull Shark progress" || exit 0
          git push
