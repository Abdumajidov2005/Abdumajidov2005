name: Update Pull Shark Progress

on:
  schedule:
    - cron: "0 * * * *"  # har soatda (UTC)
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Count merged PRs and generate SVG
        env:
          TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          # Get merged PR count for the user
          COUNT=$(curl -s -H "Authorization: token $TOKEN" \
"https://api.github.com/search/issues?q=is:pr+is:merged+author:Abdumajidov2005" | jq '.total_count')
          echo "Merged PRs count: $COUNT"

          # Define levels and colors
          declare -A LEVELS=( ["Bronze"]=2 ["Silver"]=16 ["Gold"]=128 ["Platinum"]=1024 )
          declare -A COLORS=( ["Bronze"]="#00FF00" ["Silver"]="#FFD700" ["Gold"]="#FF8C00" ["Platinum"]="#FF0000" )

          # Start SVG
          SVG="<svg width=\"400\" height=\"30\" xmlns=\"http://www.w3.org/2000/svg\">"
          X=0
          BAR_WIDTH=100

          for LEVEL in Bronze Silver Gold Platinum
          do
            TARGET=${LEVELS[$LEVEL]}
            COLOR=${COLORS[$LEVEL]}

            if [ $COUNT -ge $TARGET ]; then
              PERCENT=100
              CUR=$TARGET
            else
              PERCENT=$((COUNT * 100 / TARGET))
              CUR=$COUNT
            fi

            FILL_WIDTH=$((BAR_WIDTH * PERCENT / 100))

            # Background
            SVG="$SVG<rect x=\"$X\" y=\"0\" width=\"$BAR_WIDTH\" height=\"20\" fill=\"#e0e0e0\" rx=\"5\" ry=\"5\" />"

            # Gradient fill
            SVG="$SVG<defs><linearGradient id=\"grad$LEVEL\" x1=\"0%\" y1=\"0%\" x2=\"100%\" y2=\"0%\"><stop offset=\"0%\" stop-color=\"#ffffff\" /><stop offset=\"100%\" stop-color=\"$COLOR\" /></linearGradient></defs>"

            # Filled bar with animation
            SVG="$SVG<rect x=\"$X\" y=\"0\" width=\"0\" height=\"20\" fill=\"url(#grad$LEVEL)\" rx=\"5\" ry=\"5\">"
            SVG="$SVG<animate attributeName=\"width\" from=\"0\" to=\"$FILL_WIDTH\" dur=\"1s\" fill=\"freeze\" />"
            SVG="$SVG</rect>"

            # Label + current/target
            SVG="$SVG<text x=\"$((X + BAR_WIDTH / 2))\" y=\"15\" font-size=\"10\" text-anchor=\"middle\" fill=\"#000\">$LEVEL $CUR/$TARGET</text>"

            X=$((X + BAR_WIDTH))
          done

          SVG="$SVG</svg>"
          echo "$SVG" > pr-progress-bar.svg

      - name: Commit and push SVG
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add pr-progress-bar.svg
          git commit -m "Update Pull Shark gradient progress" || echo "No changes to commit"
          git push
