name: Update Pull Shark Progress

on:
  schedule:
    - cron: "0 * * * *"  # har soatda UTC
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y jq curl

      - name: Count merged PRs and generate SVG
        env:
          TOKEN: ${{ secrets.PAT_TOKEN }}
          GITHUB_USER: Abdumajidov2005    # o'zingizning GitHub username
          REPO: ${{ github.repository }}
          BRANCH: main                   # asosiy branch nomi
        run: |
          # Merged PR count
          COUNT=$(curl -s -H "Authorization: token $TOKEN" \
            "https://api.github.com/search/issues?q=is:pr+is:merged+author:$GITHUB_USER" | jq '.total_count')
          echo "Merged PRs count: $COUNT"

          # Levels and colors
          declare -A LEVELS=( ["Bronze"]=2 ["Silver"]=16 ["Gold"]=128 ["Platinum"]=1024 )
          declare -A COLORS=( ["Bronze"]="#cd7f32" ["Silver"]="#c0c0c0" ["Gold"]="#ffd700" ["Platinum"]="#e5e4e2" )

          # Start SVG
          SVG="<svg width=\"400\" height=\"30\" xmlns=\"http://www.w3.org/2000/svg\">"
          X=0
          BAR_WIDTH=100

          for LEVEL in Bronze Silver Gold Platinum
          do
            TARGET=${LEVELS[$LEVEL]}
            COLOR=${COLORS[$LEVEL]}

            if [ $COUNT -ge $TARGET ]; then
              PERCENT=100
              CUR=$TARGET
            else
              PERCENT=$((COUNT * 100 / TARGET))
              CUR=$COUNT
            fi

            FILL_WIDTH=$((BAR_WIDTH * PERCENT / 100))

            # Background
            SVG="$SVG<rect x=\"$X\" y=\"0\" width=\"$BAR_WIDTH\" height=\"20\" fill=\"#e0e0e0\" rx=\"5\" ry=\"5\" />"

            # Gradient fill
            SVG="$SVG<defs><linearGradient id=\"grad$LEVEL\" x1=\"0%\" y1=\"0%\" x2=\"100%\" y2=\"0%\"><stop offset=\"0%\" stop-color=\"#ffffff\" /><stop offset=\"100%\" stop-color=\"$COLOR\" /></linearGradient></defs>"

            # Filled bar
            SVG="$SVG<rect x=\"$X\" y=\"0\" width=\"$FILL_WIDTH\" height=\"20\" fill=\"url(#grad$LEVEL)\" rx=\"5\" ry=\"5\" />"

            # Label
            SVG="$SVG<text x=\"$((X + BAR_WIDTH / 2))\" y=\"15\" font-size=\"10\" text-anchor=\"middle\" fill=\"#000\">$LEVEL $CUR/$TARGET</text>"

            X=$((X + BAR_WIDTH))
          done

          SVG="$SVG</svg>"

          # Save SVG
          echo "$SVG" > pr-progress-bar.svg

      - name: Commit and push SVG
        env:
          TOKEN: ${{ secrets.PAT_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: main
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add pr-progress-bar.svg
          git diff --cached --quiet || git commit -m "Update Pull Shark gradient progress"

          # Push using PAT
          git remote set-url origin https://$TOKEN@github.com/$REPO.git
          git push origin $BRANCH
