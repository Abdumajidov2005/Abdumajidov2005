name: Update Pull Shark Progress

on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Count merged PRs and generate SVG
        run: |
          COUNT=$(curl -s "https://api.github.com/search/issues?q=is:pr+is:merged+author:Abdumajidov2005" | jq '.total_count')

          declare -A LEVELS=( ["Bronze"]=2 ["Silver"]=16 ["Gold"]=128 ["Platinum"]=1024 )
          declare -A COLORS=( ["Bronze"]="#00FF00" ["Silver"]="#FFD700" ["Gold"]="#FF8C00" ["Platinum"]="#FF0000" )

          SVG="<svg width=\"400\" height=\"30\" xmlns=\"http://www.w3.org/2000/svg\">"
          X=0
          BAR_WIDTH=100

          for LEVEL in Bronze Silver Gold Platinum
          do
            TARGET=${LEVELS[$LEVEL]}
            COLOR=${COLORS[$LEVEL]}

            if [ $COUNT -ge $TARGET ]; then
              PERCENT=100
            else
              PERCENT=$((COUNT * 100 / TARGET))
            fi

            FILL_WIDTH=$((BAR_WIDTH * PERCENT / 100))

            # Orqa fon
            SVG="$SVG<rect x=\"$X\" y=\"0\" width=\"$BAR_WIDTH\" height=\"20\" fill=\"#e0e0e0\" />"
            # To‘ldirilgan rang
            SVG="$SVG<rect x=\"$X\" y=\"0\" width=\"$FILL_WIDTH\" height=\"20\" fill=\"$COLOR\" />"
            # Text label
            SVG="$SVG<text x=\"$((X + BAR_WIDTH / 2))\" y=\"15\" font-size=\"10\" text-anchor=\"middle\" fill=\"#000\">$LEVEL</text>"

            X=$((X + BAR_WIDTH))
          done

          SVG="$SVG</svg>"
          echo "$SVG" > pr-progress-bar.svg

      - name: Commit and push SVG
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add pr-progress-bar.svg
          git commit -m "Update Pull Shark progress" || echo "No changes to commit"
          git push
