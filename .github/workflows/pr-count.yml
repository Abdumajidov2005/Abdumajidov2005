name: Update Pull Shark Progress

on:
  schedule:
    - cron: "0 * * * *"  # har soatda
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Count merged PRs and generate SVG
        env:
          TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          COUNT=$(curl -s -H "Authorization: token $TOKEN" \
"https://api.github.com/search/issues?q=is:pr+is:merged+author:Abdumajidov2005" | jq '.total_count')

          # … qolgan SVG generatsiya kodi shu yerda …

      - name: Commit and push SVG
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add pr-progress-bar.svg
          git commit -m "Update Pull Shark gradient progress" || echo "No changes to commit"
          git push
